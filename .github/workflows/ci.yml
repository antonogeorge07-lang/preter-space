name: PRETER CI

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - integration/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify TypeScript
        run: bunx tsc --noEmit

      - name: Verify formatting
        run: |
          bunx prettier --check \
            src/lib/backend.functions.ts \
            src/lib/db.js \
            convex/calls.ts \
            convex/authEmail.ts \
            tests/*.test.mjs

      - name: Authorization behavior tests
        run: bun test tests/authorization.behavior.test.mjs

      - name: Security regression tests
        run: |
          node --test \
            tests/security-gates.test.mjs \
            tests/communication-security.test.mjs \
            tests/internal-boundaries.test.mjs \
            tests/call-security.test.mjs \
            tests/session-security.test.mjs

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Scan tracked environment files
        run: |
          python3 - <<'PY'
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()

          forbidden = [
              p for p in tracked
              if p in (".env", ".env.local", ".env.production")
              or p.startswith("supabase/.temp/")
          ]

          if forbidden:
              raise SystemExit(
                  "FAIL: Local environment/runtime files are tracked"
              )

          print("PASS: Local runtime files are not tracked")
          PY

      - name: Summary
        if: success()
        run: echo "PRETER CI gates passed"
